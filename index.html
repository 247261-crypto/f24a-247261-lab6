<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canteen - The lookup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Canteen</h1></header>
<main>
  <div class="ask">
    <input id="box" type="text" value="pen" aria-label="Item to find">
    <button id="find">Find</button>
  </div>
  <div id="line" aria-live="polite"></div>

  <h2>Card</h2>
  <div class="card" id="card"></div>

  <h2>Slip</h2>
  <table>
    <thead><tr><th>Item</th><th>Times</th></tr></thead>
    <tbody id="slip"></tbody>
  </table>

  <div class="totals">
    <div>Found: <strong id="found">0</strong></div>
    <div>Dearest: <strong id="dearest">0</strong></div>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
